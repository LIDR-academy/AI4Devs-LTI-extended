openapi: 3.0.0
info:
  title: LTI (Learning Technology Initiative) API
  description: |
    REST API for the Learning Technology Initiative platform, designed for managing candidates, positions, interviews, and recruitment processes.
    
    This API follows Domain-Driven Design principles and implements a layered architecture for scalable recruitment management.
    
    ## Features
    - Candidate management with education and work experience tracking
    - Position management with company and interview flow integration
    - Application tracking through interview processes
    - File upload capabilities for resumes and documents
    - Comprehensive filtering, sorting, and pagination support
    
  version: 0.0.0.001
  contact:
    name: LTI Development Team
  license:
    name: ISC
    
servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.lti.dev
    description: Production server

paths:
  /candidates:
    get:
      summary: Get all candidates
      description: Retrieve a paginated list of candidates with optional filtering and sorting capabilities
      tags:
        - Candidates
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of candidates per page
        - in: query
          name: search
          schema:
            type: string
          description: Search term to filter candidates by first name, last name, or email
        - in: query
          name: sort
          schema:
            type: string
            enum: [firstName, lastName, email]
            default: firstName
          description: Field to sort candidates by
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort order
      responses:
        '200':
          description: Successfully retrieved candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateListResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      summary: Create a new candidate
      description: Add a new candidate to the system with their personal information, education, and work experience
      tags:
        - Candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateRequest'
      responses:
        '201':
          description: Candidate created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCandidateResponse'
        '400':
          description: Validation error or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /candidates/{id}:
    get:
      summary: Get candidate by ID
      description: Retrieve detailed information about a specific candidate including their applications, interviews, and related data
      tags:
        - Candidates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Candidate ID
      responses:
        '200':
          description: Successfully retrieved candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetails'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Candidate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      summary: Update candidate interview stage
      description: Update the current interview stage for a candidate's application
      tags:
        - Candidates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Candidate ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateStageRequest'
      responses:
        '200':
          description: Candidate stage updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCandidateStageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /candidates/{candidateId}/interviews:
    post:
      summary: Create a new interview for a candidate
      description: Creates a new interview for one of the candidate's applications. Validates that the application belongs to the candidate, the interview step belongs to the position's interview flow, and the employee is active.
      tags:
        - Candidates
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: integer
          description: ID of the candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewRequest'
            example:
              applicationId: 1
              interviewStepId: 2
              employeeId: 3
              interviewDate: "2026-06-20T10:00:00Z"
              result: "Pending"
              score: 4
              notes: "Strong technical candidate"
      responses:
        '201':
          description: Interview created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewResponse'
              example:
                id: 99
                applicationId: 1
                interviewStepId: 2
                employeeId: 3
                interviewDate: "2026-06-20T10:00:00.000Z"
                result: "Pending"
                score: 4
                notes: "Strong technical candidate"
        '400':
          description: Validation error or business rule violation (step not in flow, employee not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Candidate, application, interview step, or employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /candidates/{candidateId}/interviews/{interviewId}:
    patch:
      summary: Update an existing interview
      description: Partially updates an existing interview for a candidate.
      tags:
        - Candidates
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: integer
          description: ID of the candidate
        - in: path
          name: interviewId
          required: true
          schema:
            type: integer
          description: ID of the interview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInterviewRequest'
      responses:
        '200':
          description: Interview updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Interview, candidate, or related resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete an interview
      description: Deletes an existing interview. Completed interviews (Passed/Failed) cannot be deleted.
      tags:
        - Candidates
      parameters:
        - in: path
          name: candidateId
          required: true
          schema:
            type: integer
          description: ID of the candidate
        - in: path
          name: interviewId
          required: true
          schema:
            type: integer
          description: ID of the interview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
              required:
                - reason
      responses:
        '200':
          description: Interview deleted successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Interview or candidate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Business rule violation (e.g. completed interview cannot be deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /positions:
    get:
      summary: Get all positions
      description: Retrieve all visible positions in the system
      tags:
        - Positions
      responses:
        '200':
          description: Successfully retrieved positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /positions/{id}:
    get:
      summary: Get position by ID
      description: Retrieve detailed information about a specific position
      tags:
        - Positions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Position ID
      responses:
        '200':
          description: Successfully retrieved position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          description: Invalid position ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      summary: Update position
      description: |
        Update an existing position with new information. Supports partial updates - only fields provided in the request body will be updated.
        Fields not provided will maintain their existing values in the database.
      tags:
        - Positions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Position ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionRequest'
      responses:
        '200':
          description: Position updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePositionResponse'
        '400':
          description: Validation error or invalid reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /positions/{id}/candidates:
    get:
      summary: Get candidates by position
      description: Retrieve all candidates who have applied to a specific position with their interview progress
      tags:
        - Positions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Position ID
      responses:
        '200':
          description: Successfully retrieved candidates for position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionCandidate'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Assign existing candidate to a position
      description: |
        Creates a new Application linking an existing Candidate to the specified Position
        and places the candidate on the first interview step (lowest `orderIndex`) of the
        position's InterviewFlow. Runs inside a single Prisma transaction. The position must
        be in status `Draft` or `Open`; positions in `Closed` or `Hired` are rejected.
      tags:
        - Positions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Position ID (`positionId`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCandidateRequest'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCandidateResponse'
        '400':
          description: Validation error (`code: VALIDATION_ERROR`). Returned when the request body is malformed, the path id is not numeric, or `notes` exceeds 500 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCandidateErrorResponse'
        '404':
          description: Position not found (`code: POSITION_NOT_FOUND`) or Candidate not found (`code: CANDIDATE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCandidateErrorResponse'
        '409':
          description: Conflict — `code: POSITION_CLOSED` when the position status is `Closed` or `Hired`, or `code: DUPLICATE_APPLICATION` when an Application already exists for the (positionId, candidateId) pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCandidateErrorResponse'
        '422':
          description: Position has no configured interview steps (`code: NO_INTERVIEW_STEPS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCandidateErrorResponse'
        '500':
          description: Unexpected server error (`code: INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCandidateErrorResponse'

  /positions/{positionId}/candidates/{candidateId}:
    delete:
      summary: Remove candidate application from position
      description: Remove the candidate-position application relationship for the provided IDs
      tags:
        - Positions
      parameters:
        - in: path
          name: positionId
          required: true
          schema:
            type: integer
          description: Position ID
        - in: path
          name: candidateId
          required: true
          schema:
            type: integer
          description: Candidate ID
      responses:
        '204':
          description: Relationship removed successfully
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Position, candidate, or relationship not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Deletion blocked by domain constraints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /positions/{id}/candidates/names:
    get:
      summary: Get candidate names by position
      description: Retrieve simplified candidate information (ID and name only) for a specific position
      tags:
        - Positions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Position ID
      responses:
        '200':
          description: Successfully retrieved candidate names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateName'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /positions/{id}/interviewflow:
    get:
      summary: Get interview flow by position
      description: Retrieve the interview flow configuration for a specific position
      tags:
        - Positions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Position ID
      responses:
        '200':
          description: Successfully retrieved interview flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewFlowResponse'
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /upload:
    post:
      summary: Upload file
      description: Upload a file (PDF or DOCX) for resume or document storage
      tags:
        - File Upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload (PDF or DOCX, max 10MB)
              required:
                - file
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          description: Invalid file type or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upload error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CandidateListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
      required:
        - data
        - metadata

    Candidate:
      type: object
      description: Candidate list item returned by `GET /candidates`. Heavy relations (`educations`, `workExperiences`, `resumes`) are intentionally excluded from the list payload and only available on `GET /candidates/{id}`.
      properties:
        id:
          type: integer
          description: Unique candidate identifier
        firstName:
          type: string
          description: Candidate's first name
        lastName:
          type: string
          description: Candidate's last name
        email:
          type: string
          format: email
          description: Candidate's email address
        phone:
          type: string
          nullable: true
          description: Candidate's phone number
        address:
          type: string
          nullable: true
          description: Candidate's address
        activeProcesses:
          type: array
          items:
            $ref: '#/components/schemas/ActiveProcess'
          description: All applications on positions with `status === "Open"`, ordered by applicationDate desc. Empty array when none.
      required:
        - id
        - firstName
        - lastName
        - email
        - activeProcesses

    ActiveProcess:
      type: object
      description: Derived snapshot of the candidate's currently active hiring process.
      properties:
        applicationId:
          type: integer
          description: Identifier of the underlying Application
        applicationDate:
          type: string
          format: date-time
          description: ISO-8601 application date
        position:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
            status:
              type: string
            company:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
              required:
                - id
                - name
          required:
            - id
            - title
            - status
            - company
        currentStep:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            orderIndex:
              type: integer
          required:
            - id
            - name
            - orderIndex
        totalSteps:
          type: integer
          description: Total number of steps in the position's interview flow
      required:
        - applicationId
        - applicationDate
        - position
        - currentStep
        - totalSteps

    CandidateDetails:
      allOf:
        - $ref: '#/components/schemas/Candidate'
        - type: object
          properties:
            applications:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Application'
                  - type: object
                    properties:
                      position:
                        type: object
                        properties:
                          id:
                            type: integer
                          title:
                            type: string
                      interviews:
                        type: array
                        items:
                          $ref: '#/components/schemas/Interview'

    CreateCandidateRequest:
      type: object
      properties:
        firstName:
          type: string
          description: Candidate's first name
        lastName:
          type: string
          description: Candidate's last name
        email:
          type: string
          format: email
          description: Candidate's email address
        phone:
          type: string
          nullable: true
          description: Candidate's phone number
        address:
          type: string
          nullable: true
          description: Candidate's address
        educations:
          type: array
          items:
            $ref: '#/components/schemas/CreateEducationRequest'
        workExperiences:
          type: array
          items:
            $ref: '#/components/schemas/CreateWorkExperienceRequest'
        cv:
          $ref: '#/components/schemas/CreateResumeRequest'
      required:
        - firstName
        - lastName
        - email

    CreateCandidateResponse:
      type: object
      properties:
        id:
          type: integer
          description: Created candidate ID
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
      required:
        - id
        - firstName
        - lastName
        - email

    UpdateCandidateStageRequest:
      type: object
      properties:
        applicationId:
          type: string
          description: Application ID (will be converted to integer)
        currentInterviewStep:
          type: string
          description: Current interview step (will be converted to integer)
      required:
        - applicationId
        - currentInterviewStep

    UpdateCandidateStageResponse:
      type: object
      properties:
        message:
          type: string
          example: "Candidate stage updated successfully"
        data:
          $ref: '#/components/schemas/Application'

    Position:
      type: object
      properties:
        id:
          type: integer
          description: Position unique identifier
        companyId:
          type: integer
          description: Associated company ID
        interviewFlowId:
          type: integer
          description: Associated interview flow ID
        title:
          type: string
          description: Position title
        description:
          type: string
          description: Position description
        status:
          type: string
          description: Position status
          default: "Draft"
        isVisible:
          type: boolean
          description: Whether position is visible to candidates
          default: false
        location:
          type: string
          description: Position location
        jobDescription:
          type: string
          description: Detailed job description
        requirements:
          type: string
          nullable: true
          description: Position requirements
        responsibilities:
          type: string
          nullable: true
          description: Position responsibilities
        salaryMin:
          type: number
          nullable: true
          description: Minimum salary
        salaryMax:
          type: number
          nullable: true
          description: Maximum salary
        employmentType:
          type: string
          nullable: true
          description: Type of employment
        benefits:
          type: string
          nullable: true
          description: Position benefits
        companyDescription:
          type: string
          nullable: true
          description: Company description
        applicationDeadline:
          type: string
          format: date-time
          nullable: true
          description: Application deadline
        contactInfo:
          type: string
          nullable: true
          description: Contact information
      required:
        - companyId
        - interviewFlowId
        - title
        - description
        - location
        - jobDescription

    UpdatePositionRequest:
      type: object
      properties:
        companyId:
          type: integer
          minimum: 1
          description: Associated company ID (must be a positive integer)
        interviewFlowId:
          type: integer
          minimum: 1
          description: Associated interview flow ID (must be a positive integer)
        title:
          type: string
          maxLength: 100
          minLength: 1
          description: Position title (required, 1-100 characters)
        description:
          type: string
          minLength: 1
          description: Position description (required, cannot be empty)
        status:
          type: string
          enum: [Draft, Open, Closed, Hired]
          description: Position status (must be one of the canonical English values)
        isVisible:
          type: boolean
          description: Whether position is visible to candidates
        location:
          type: string
          minLength: 1
          description: Position location (required, cannot be empty)
        jobDescription:
          type: string
          minLength: 1
          description: Detailed job description (required, cannot be empty)
        requirements:
          type: string
          nullable: true
          description: Position requirements
        responsibilities:
          type: string
          nullable: true
          description: Position responsibilities
        salaryMin:
          type: number
          minimum: 0
          nullable: true
          description: Minimum salary (must be >= 0, cannot be greater than salaryMax)
        salaryMax:
          type: number
          minimum: 0
          nullable: true
          description: Maximum salary (must be >= 0, cannot be less than salaryMin)
        employmentType:
          type: string
          nullable: true
          description: Type of employment
        benefits:
          type: string
          nullable: true
          description: Position benefits
        companyDescription:
          type: string
          nullable: true
          description: Company description
        applicationDeadline:
          type: string
          format: date-time
          nullable: true
          description: Application deadline (must be a future date)
        contactInfo:
          type: string
          nullable: true
          description: Contact information

    UpdatePositionResponse:
      type: object
      properties:
        message:
          type: string
          example: "Position updated successfully"
        data:
          $ref: '#/components/schemas/Position'

    PositionCandidate:
      type: object
      properties:
        fullName:
          type: string
          description: Candidate's full name
        currentInterviewStep:
          type: string
          description: Current interview step name
        candidateId:
          type: integer
          description: Candidate ID
        applicationId:
          type: integer
          description: Application ID
        averageScore:
          type: number
          description: Average interview score
      required:
        - fullName
        - currentInterviewStep
        - candidateId
        - applicationId
        - averageScore

    CandidateName:
      type: object
      properties:
        candidateId:
          type: integer
          description: Candidate ID
        fullName:
          type: string
          description: Candidate's full name
      required:
        - candidateId
        - fullName

    InterviewFlowResponse:
      type: object
      properties:
        interviewFlow:
          type: object
          properties:
            positionName:
              type: string
              description: Position title
            interviewFlow:
              $ref: '#/components/schemas/InterviewFlow'

    InterviewFlow:
      type: object
      properties:
        id:
          type: integer
          description: Interview flow ID
        description:
          type: string
          description: Interview flow description
        interviewSteps:
          type: array
          items:
            $ref: '#/components/schemas/InterviewStep'

    InterviewStep:
      type: object
      properties:
        id:
          type: integer
          description: Interview step ID
        interviewFlowId:
          type: integer
          description: Associated interview flow ID
        interviewTypeId:
          type: integer
          description: Associated interview type ID
        name:
          type: string
          description: Interview step name
        orderIndex:
          type: integer
          description: Step order in the interview flow

    Education:
      type: object
      properties:
        id:
          type: integer
          description: Education record ID
        candidateId:
          type: integer
          description: Associated candidate ID
        institution:
          type: string
          description: Educational institution name
        title:
          type: string
          description: Degree or certification title
        startDate:
          type: string
          format: date-time
          description: Education start date
        endDate:
          type: string
          format: date-time
          nullable: true
          description: Education end date
      required:
        - institution
        - title
        - startDate

    CreateEducationRequest:
      type: object
      properties:
        institution:
          type: string
          description: Educational institution name
        title:
          type: string
          description: Degree or certification title
        startDate:
          type: string
          format: date-time
          description: Education start date
        endDate:
          type: string
          format: date-time
          nullable: true
          description: Education end date
      required:
        - institution
        - title
        - startDate

    WorkExperience:
      type: object
      properties:
        id:
          type: integer
          description: Work experience record ID
        candidateId:
          type: integer
          description: Associated candidate ID
        company:
          type: string
          description: Company name
        position:
          type: string
          description: Job position title
        description:
          type: string
          nullable: true
          description: Job description
        startDate:
          type: string
          format: date-time
          description: Employment start date
        endDate:
          type: string
          format: date-time
          nullable: true
          description: Employment end date
      required:
        - company
        - position
        - startDate

    CreateWorkExperienceRequest:
      type: object
      properties:
        company:
          type: string
          description: Company name
        position:
          type: string
          description: Job position title
        description:
          type: string
          nullable: true
          description: Job description
        startDate:
          type: string
          format: date-time
          description: Employment start date
        endDate:
          type: string
          format: date-time
          nullable: true
          description: Employment end date
      required:
        - company
        - position
        - startDate

    Resume:
      type: object
      properties:
        id:
          type: integer
          description: Resume record ID
        candidateId:
          type: integer
          description: Associated candidate ID
        filePath:
          type: string
          description: Resume file path
        fileType:
          type: string
          description: Resume file MIME type
      required:
        - filePath
        - fileType

    CreateResumeRequest:
      type: object
      properties:
        filePath:
          type: string
          description: Resume file path
        fileType:
          type: string
          description: Resume file MIME type
      required:
        - filePath
        - fileType

    Application:
      type: object
      properties:
        id:
          type: integer
          description: Application ID
        candidateId:
          type: integer
          description: Associated candidate ID
        positionId:
          type: integer
          description: Associated position ID
        applicationDate:
          type: string
          format: date-time
          description: Application submission date
        currentInterviewStep:
          type: integer
          description: Current interview step ID
        notes:
          type: string
          nullable: true
          description: Application notes

    Interview:
      type: object
      properties:
        interviewDate:
          type: string
          format: date-time
          description: Interview date and time
        interviewStep:
          type: object
          properties:
            name:
              type: string
              description: Interview step name
        notes:
          type: string
          nullable: true
          description: Interview notes
        score:
          type: number
          nullable: true
          description: Interview score

    FileUploadResponse:
      type: object
      properties:
        filePath:
          type: string
          description: Uploaded file path
        fileType:
          type: string
          description: Uploaded file MIME type
      required:
        - filePath
        - fileType

    PaginationMetadata:
      type: object
      properties:
        total:
          type: integer
          description: Total number of records
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Records per page
        totalPages:
          type: integer
          description: Total number of pages
      required:
        - total
        - page
        - limit
        - totalPages

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
        error:
          type: string
          description: Detailed error information
      required:
        - message

    AssignCandidateRequest:
      type: object
      properties:
        candidateId:
          type: integer
          minimum: 1
          description: ID of the existing Candidate to assign to the position. Required, positive integer.
        notes:
          type: string
          maxLength: 500
          nullable: true
          description: Optional free-text notes about the candidate for this position. Maximum 500 characters.
      required:
        - candidateId
      additionalProperties: false

    AssignCandidateResponse:
      type: object
      description: |
        Created Application row. The schema exposes both `currentInterviewStep` (canonical, single FK column in the database) and `interviewStepId` (alias of the same value, kept for frontend compatibility — they will always be equal).
      properties:
        id:
          type: integer
          description: Application ID
        positionId:
          type: integer
        candidateId:
          type: integer
        applicationDate:
          type: string
          format: date-time
        currentInterviewStep:
          type: integer
          description: ID of the InterviewStep on which the candidate was placed (lowest `orderIndex`).
        interviewStepId:
          type: integer
          description: Alias of `currentInterviewStep`. Same numeric value. Marked for removal once the frontend is fully migrated to `currentInterviewStep`.
        notes:
          type: string
          nullable: true
      required:
        - id
        - positionId
        - candidateId
        - applicationDate
        - currentInterviewStep
        - interviewStepId

    AssignCandidateErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - POSITION_NOT_FOUND
        - CANDIDATE_NOT_FOUND
        - POSITION_CLOSED
        - DUPLICATE_APPLICATION
        - NO_INTERVIEW_STEPS
        - INTERNAL_ERROR

    InterviewResponse:
      type: object
      properties:
        id:
          type: integer
        applicationId:
          type: integer
        interviewStepId:
          type: integer
        employeeId:
          type: integer
        interviewDate:
          type: string
          format: date-time
        result:
          type: string
          nullable: true
          enum: [Pending, Passed, Failed, null]
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
        notes:
          type: string
          nullable: true

    CreateInterviewRequest:
      type: object
      additionalProperties: false
      required:
        - applicationId
        - interviewStepId
        - employeeId
        - interviewDate
      properties:
        applicationId:
          type: integer
          minimum: 1
          description: ID of the application (must belong to the path candidateId)
        interviewStepId:
          type: integer
          minimum: 1
          description: ID of the interview step (must belong to the application's position's interview flow)
        employeeId:
          type: integer
          minimum: 1
          description: ID of the interviewing employee (must be active)
        interviewDate:
          type: string
          format: date-time
          description: ISO 8601 date-time of the interview
        result:
          type: string
          nullable: true
          enum: [Pending, Passed, Failed]
          description: Interview result (defaults to Pending when omitted)
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
          description: Interview score (0-5 inclusive or null)
        notes:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional notes (max 1000 characters)

    UpdateInterviewRequest:
      type: object
      properties:
        interviewStepId:
          type: integer
          minimum: 1
        employeeId:
          type: integer
          minimum: 1
        interviewDate:
          type: string
          format: date-time
        result:
          type: string
          nullable: true
          enum: [Pending, Passed, Failed]
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
        notes:
          type: string
          maxLength: 1000
          nullable: true

    AssignCandidateErrorResponse:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/AssignCandidateErrorCode'
        message:
          type: string
        error:
          type: string
      required:
        - code
        - message

tags:
  - name: Candidates
    description: Operations related to candidate management
  - name: Positions
    description: Operations related to job position management
  - name: File Upload
    description: Operations related to file uploads
